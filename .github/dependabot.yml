version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # Keep compiler support aligned with @astrojs/check.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Match the Node major declared in .nvmrc and package.json.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
